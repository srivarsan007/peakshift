name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest test suite
        run: |
          pytest -v

  e2e:
    name: Headless Chrome E2E Upload Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Google Chrome installation
        run: |
          which google-chrome || which chromium-browser || which chromium || true
          google-chrome --version || chromium-browser --version || true

      - name: Start PeakShift API server
        run: |
          uvicorn peakshift.api.main:app --host 0.0.0.0 --port 8000 &
          # Wait for server health endpoint
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/health | grep '"status":"ok"'; then
              echo "Server is ready."
              break
            fi
            sleep 1
          done

      - name: Generate test cases
        run: |
          python scripts/make_test_cases.py

      - name: Run E2E upload check
        run: |
          node scripts/e2e_upload_check.js http://127.0.0.1:8000
